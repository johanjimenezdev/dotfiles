# -- Terminal Colors -----------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# -- Prefix Key ----------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -- No Confirm On Close--------------------------------------
unbind x
unbind &
bind x kill-window
bind X kill-session

# -- Config Reload -------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# -- General Settings ----------------------------------------
set-window-option -g mode-keys vi
set -g escape-time 10
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -- Popup Lazygit -------------------------------------------
bind -r g display-popup -d "#{pane_current_path}" -w80% -h80% -E lazygit

# -- Popup Claude Session ------------------------------------
bind -r C run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'

# -- Status Bar ----------------------------------------------
set -g status-style "bg=#090e13,fg=#c5c9c7"
set -g status-left "#[fg=#8a9a7b]  #S "
set -g window-status-separator ""
set -g window-status-format "#[fg=#9ba4b0] #I:#W "
set -g window-status-current-format "#[bg=#393b44,fg=#8ba4b0,bold] #I:#W "
set -g status-right "%Y-%m-%d #[bg=#c4b28a,fg=#0d0c0c] #H "

# -- Plugins -------------------------------------------------
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-pain-control"

run "~/.tmux/plugins/tpm/tpm"
