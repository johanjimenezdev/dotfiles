"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

[line_break]
disabled = true

format = """
$directory\
$git_branch\
$git_status\
$character
"""

right_format = """
$all
"""

[directory]
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style)(base) "

[git_status]
format = "[$untracked$staged$modified$renamed$conflicted$ahead_behind ]($style)"
staged     = "[+](green)"
modified   = "[!](yellow)"
renamed    = "[»](blue)"
deleted    = "[-](red)"
untracked  = "[?](red)"
stashed    = "[≡](lavender)"
conflicted = "[✖](red bold)"
ahead      = "[⇡${count}](teal)"
behind     = "[⇣${count}](peach)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count}](mauve)"

[time]
disabled = true
